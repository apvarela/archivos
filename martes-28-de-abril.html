    const countryToCode = {
      'Costa Rica':'cr','Brasil':'br','Brazil':'br','Argentina':'ar','República Dominicana':'do','Republica Dominicana':'do',
      'Estados Unidos':'us','Estado Unidos':'us','Estados unidos':'us','Uruguay':'uy','España':'es','Perú':'pe','Colombia':'co',
      'Chile':'cl','México':'mx','México.':'mx','Alemania':'de','Canadá':'ca','Italia':'it','Polonia':'pl','Ecuador':'ec',
      'Portugal':'pt','Francia':'fr','Inglaterra':'gb','Paraguay':'py','Puerto Rico':'pr'
    };

    const fallback = 'https://images.squarespace-cdn.com/content/v1/67c081037d254346e234e4f4/2580913b-ce71-42a8-9864-31db62e98bed/spk_no_photo.jpg?format=2500w';
    const app = document.getElementById('app');

    const normalizeName = (text = '') => text
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/[^a-zA-Z0-9 ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();

    const esc = (value = '') => String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const getPhoto = (speaker = '', explicitPhoto = '') => {
      if (explicitPhoto && /^https?:\/\//i.test(explicitPhoto)) return explicitPhoto;
      const clean = speaker.replace(/^Dra?\.?\s*/, '').split(',')[0].trim();
      const key = aliases[clean] || clean;
      if (photos[key]) return photos[key];

      const nClean = normalizeName(clean);
      const normalizedAlias = Object.keys(aliases).find((a) => normalizeName(a) === nClean);
      if (normalizedAlias) {
        const resolved = aliases[normalizedAlias];
        if (photos[resolved]) return photos[resolved];
      }

      const normalizedPhotoKey = Object.keys(photos).find((name) => normalizeName(name) === nClean);
      if (normalizedPhotoKey) return photos[normalizedPhotoKey];

      return fallback;
    };

    const getCountry = (speaker = '') => {
      if (!speaker.includes(',')) return '';
      return speaker.split(',').slice(1).join(',').replace(/\(.*?\)/g, '').trim();
    };

    const getFlag = (speaker = '') => {
      const country = getCountry(speaker);
      const code = countryToCode[country];
      return code ? `https://flagpedia.net/data/flags/w580/${code}.webp` : '';
    };

    const speakerHtml = (speaker = '') => {
      if (!speaker) return '';
      const flag = getFlag(speaker);
      return `<span class="speaker-line">${esc(speaker)}${flag ? `<img src="${flag}" width="26" alt="Bandera de ${esc(getCountry(speaker))}">` : ''}</span>`;
    };

    const shouldHidePhoto = (dayTitle = '', text = '') => {
      const t = normalizeName(text);
      const d = normalizeName(dayTitle);
      if (d.includes('martes')) return true;
      return t.includes('discusion') || t.includes('discussion') || t.includes('coffe break') || t.includes('coffee break') || t.includes('almuerzo') || t.includes('actividad cultural') || t.includes('moderador');
    };

    for (const day of schedule) {
      let html = `<section class="day"><div class="day-title">${esc(day.title)}</div>`;

      for (const section of day.sections) {
        if (section.title2) {
          html += `<div class="dual-header"><div></div><div>${esc(section.title)}</div><div>${esc(section.title2)}</div></div>`;
        } else {
          html += `<div class="section-title">${esc(section.title)}</div>`;
        }

        if (section.moderator) {
          html += `<div class="moderator">${esc(section.moderator)}${section.moderator2 ? '<br>' + esc(section.moderator2) : ''}</div>`;
        }

        html += '<table class="table"><tbody>';

        for (const row of section.rows) {
          if (row.track2) {
            const text1 = row.title1 || row.track1 || '';
            const text2 = row.title2 || row.track2 || '';
            const hide1 = shouldHidePhoto(day.title, text1);
            const hide2 = shouldHidePhoto(day.title, text2);
            html += `<tr><td class="time">${esc(row.time || '')}</td>`;
            html += hide1
              ? `<td class="content centered" colspan="2">${esc(text1)}${speakerHtml(row.speaker1)}</td>`
              : `<td class="speaker-cell"><img class="avatar" src="${getPhoto(row.speaker1, row.photo1)}" alt="${esc(row.speaker1 || 'Conferencista')}"></td><td class="content">${esc(text1)}${speakerHtml(row.speaker1)}</td>`;
            html += hide2
              ? `<td class="content centered" colspan="2">${esc(text2)}${speakerHtml(row.speaker2)}</td>`
              : `<td class="speaker-cell"><img class="avatar" src="${getPhoto(row.speaker2, row.photo2)}" alt="${esc(row.speaker2 || 'Conferencista')}"></td><td class="content">${esc(text2)}${speakerHtml(row.speaker2)}</td>`;
            html += `</tr>`;
          } else {
            const text1 = row.title1 || row.track1 || '';
            const hide1 = shouldHidePhoto(day.title, text1);
            html += `<tr><td class="time">${esc(row.time || '')}</td>`;
            html += hide1
              ? `<td class="content centered" colspan="2">${esc(text1)}${speakerHtml(row.speaker1)}</td>`
              : `<td class="speaker-cell"><img class="avatar" src="${getPhoto(row.speaker1, row.photo1)}" alt="${esc(row.speaker1 || 'Conferencista')}"></td><td class="content">${esc(text1)}${speakerHtml(row.speaker1)}</td>`;
            html += `</tr>`;
          }
        }

        html += '</tbody></table>';
      }

      html += '</section>';
      app.insertAdjacentHTML('beforeend', html);
    }
